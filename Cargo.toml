[package]
name = "efference"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# In-process MCP tool servers consumed as lib crates (DESIGN §5), not subprocesses.
fs-mcp = { path = "../fs-mcp" }
semantic-edit-mcp = { path = "../semantic-edit-mcp" }
# `client` is the transport-agnostic client protocol (docs/tools.md); the
# in-process servers above bring the `server` half through their own dependency.
mcplease = { version = "0.4.2", features = ["client"], default-features = false }
anyhow = "1"
# Lightweight logging facade + env-driven backend. The daemon emits request sizes,
# fork-peek fallbacks, capped tool results, and full API error bodies; control verbosity
# with RUST_LOG (e.g. `RUST_LOG=efference=debug efference serve`).
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.53.1", features = [
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "io-std",
  "io-util",
  "fs",
] }
libc = "0.2.189"
clap = { version = "4", features = ["derive", "env"] }
# Core trillium types (Conn/Handler/Method) for the control-channel HTTP server.
trillium = "1.3.0"
# Already in-tree under trillium; direct only to name the inner conn type the TCP
# gate reads `authority()` from — h2's `:authority` is not consulted by
# `trillium::Conn::host()` (docs/web-bind.md).
trillium-http = "1.6"
trillium-client = { version = "0.9.14", features = ["sse"] }
trillium-client-retry = "0.0.1"
trillium-rustls = "0.11.3"
# 0.6.4 adds `UnixClientConfig` — the client-side Unix-socket connector the
# control-channel client (src/client.rs) dials the daemon through (DESIGN §10).
trillium-tokio = "0.6.4"
# StreamExt for consuming the SSE EventStream; already in-tree via trillium.
futures-lite = "2.6.1"
trillium-router = "0.5.2"
# The host's session proxy (docs/host.md): `/sessions/<id>/…` forwarded to that
# session's Unix socket. Chosen over a hand-rolled forward for the two properties
# the control API needs — a streamed response body (so SSE flushes through instead
# of buffering) and upgrade forwarding.
trillium-proxy = "0.8.5"
# Already in-tree under trillium-tokio; a direct dependency only to *name* the
# `ServerHandle` the TCP bind's spawn returns (docs/web-bind.md).
trillium-server-common = "0.7"
# HTTP/3 for the TLS bind (docs/web-bind.md): a QUIC listener on the same port,
# auto-paired with the TLS listener and advertised via alt-svc.
trillium-quinn = "0.1.6"
# HEAD requests: rewritten to GET going in, body stripped (content-length kept)
# coming out — the router itself has no HEAD story.
trillium-head = "0.3"
trillium-sse = "0.3.0"
# The web client (docs/web-client.md): builds `web/` at compile time and embeds
# the dist assets in the binary; the `dev-proxy` feature below proxies to a
# spawned Vite dev server instead (HMR). Build mode needs pnpm on PATH.
trillium-frontend = "0.4.3"
# The TCP gate's cookie jar (docs/web-bind.md). Parsing must cover every cookie
# field line — h2/h3 clients split one line per cookie — which the raw-header
# read it replaced did not.
trillium-cookies = "0.5.1"

# TUI (DESIGN §10 — the interactive client). Vendored-and-adapted from ferritin's
# interactive renderer into src/tui/: a ratatui document renderer with syntect
# theming, markdown parsing, a custom scrollbar, line wrapping, and collapsible
# nodes. crossterm/crossbeam drive the dedicated UI thread; the SSE event tail is
# bridged in from tokio (src/main.rs).
ratatui = "0.30"
crossterm = "0.29"
crossbeam-channel = "0.5"
pulldown-cmark = "0.13"
percent-encoding = "2.3"
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "html",
  "plist-load",
  "yaml-load",
  "dump-load",
  "dump-create",
  "regex-onig",
] }
# Used by the vendored render_context (getters/builders) and its theme error type.
fieldwork = "0.5.3"
thiserror = "2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
# System clipboard for the interactive TUI. The adapter in `src/tui/clipboard.rs`
# keeps OS access and its in-process fallback outside the deterministic composer.
# `image-data` is on because a pasted screenshot is an attachment (docs/inbox.md):
# the clipboard's raw RGBA is re-encoded as a PNG into the store. It costs the
# image/tiff/zune-jpeg stack, most of which `image` (below) already pulls in.
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
yash-syntax = "=0.14.1"
# Config (docs/permissions.md): the file is TOML, decoded via `toml_edit`'s
# serde layer and edited in place via its format-preserving `DocumentMut` — the same crate both
# reads the config and writes the harness's auto-persisted edits back, comments intact. A parse
# error carries a source span; its `Display` renders the offending line (the load-time diagnostic
# that stands in for KDL's miette report).
toml_edit = { version = "0.25.13", features = ["serde"] }
# Order-preserving map. `[context]` entries render as preamble sections in the operator's
# document order (backlog/preamble-context.md), so they can't ride the sorted BTreeMap the
# policy tables use. Already compiled in-tree via toml_edit; this just promotes it to direct.
indexmap = { version = "2", features = ["serde"] }
notify-debouncer-full = "0.7"
# The discovery ignore set (docs/web-bind.md): `/files` listings, the recursive
# listing behind the finder, and directory-scope change streams all hide what
# git hides. Already compiled in-tree; this promotes it to direct.
ignore = "0.4"
# OAuth for connected HTTP providers (docs/mcp-auth.md). `FollowRedirects` is a
# client handler: OAuth discovery chases `Location` across origins, and it drops
# `Authorization`/`Cookie` on a cross-origin hop, which is exactly the leak the
# spec's threat model is about. trillium-client does not follow redirects itself.
trillium-redirect = { version = "0.3.0", features = ["client"] }
# PKCE (RFC 7636 S256): a CSPRNG verifier, its SHA-256 digest, base64url-nopad
# for both. efference is a *public* OAuth client — a shipped binary can hold no
# secret — so PKCE is what stands between an intercepted authorization code and
# a token, and these three are load-bearing rather than incidental.
base64 = "0.23.1"
sha2 = "0.11.0"
rand = "0.10.2"
# Root-derived credentials for the TCP bind (docs/web-bind.md): HKDF with per-purpose
# context strings turns the one injected root into the cookie-HMAC key, the TOTP
# secret, and the bearer — same root in, same secrets out, nothing secret on disk.
# SHA-1 is TOTP only (RFC 6238's stock-authenticator default), never a signature.
# data-encoding brings the base32 an `otpauth://` secret is spelled in.
hkdf = "0.13"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# Renders the `otpauth://` enrollment QR as unicode blocks at the host terminal —
# the only place the TOTP secret is ever displayed (docs/web-bind.md). No image
# features; the terminal is the only target.
qrcode = { version = "0.14", default-features = false }
# Opens the operator's browser for the MCP authorization step (docs/mcp-auth.md).
# Only reached from `efference serve` with a tty; a headless boot prints the URL
# instead, since there is no browser to hand a redirect back to.
webbrowser = "1.2.4"
jiter = { version = "0.16.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Terminal image rendering for the TUI (docs/tui.md): protocol detection
# (kitty/iTerm2), the font-size-in-pixels query, per-protocol encoding, and the
# cell-skip that keeps ratatui from overwriting a drawn image. Default features
# off: they re-enable all of `image`'s decoders (the slim set above is the
# decode surface) and add a pkg-config dependency on libchafa.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }

[features]
# Serve the web client from a spawned Vite dev server (with HMR) instead of the
# compile-time embed: `cargo run --features dev-proxy -- serve --bind …`.
dev-proxy = ["trillium-frontend/dev-proxy"]

[dev-dependencies]
# Snapshot the TUI as plain-text character grids (DESIGN: "playwright for TUIs").
# File snapshots land in src/tui/snapshots/*.snap — committed, diffable, and
# readable without running anything. `cargo insta review` / `accept` to update.
insta = "1.48.0"

# Drive the control router over an in-memory virtual transport: `connector()` builds
# a client-side Connector from a handler, which `Client::with_connector` accepts. No
# socket is bound, so the daemon tests neither collide on a fixed path nor hit
# Darwin's 104-byte `SUN_LEN` limit on the harness's long per-session $TMPDIR.
# The `tokio` feature runs test handlers on the same runtime the daemon uses
# (`trillium-tokio`); without it the harness approximates a runtime by spawning
# threads, and any handler touching tokio primitives (`tokio::time::timeout` in
# the settle wait) panics off-runtime.
trillium-testing = { version = "0.10.0", features = ["tokio"] }

[build-dependencies]
# The theme set is baked at build time from assets/themes/*/*.tmTheme into OUT_DIR
# (see build.rs, vendored from ferritin). The .tmTheme files come from the git
# submodules under assets/themes/ — a fresh clone needs
# `git submodule update --init --recursive` or the build falls back to an empty set.
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "plist-load",
  "dump-load",
  "dump-create",
  "regex-onig",
] }

