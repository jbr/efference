[package]
name = "efference"
version = "0.1.0"
edition = "2024"
# dist's GitHub workflow names the repository it runs in (process/releasing.md).
repository = "https://github.com/jbr/efference"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# The `kind` a log frame carries is its payload variant's name, derived rather than
# written per variant (docs/log-and-projection.md). Already compiled in-tree, derive
# included, under ratatui and semantic-edit-mcp; this promotes it to direct.
strum = { version = "0.28", features = ["derive"] }
# In-process MCP tool servers consumed as lib crates (DESIGN §5), not subprocesses.
fs-mcp = "0.2"
semantic-edit-mcp = "0.4"
# The `lsp` built-ins (docs/tools.md): one language-server host shared by every
# session on this host, each session bound at its working directory.
structural-lsp = "0.1.3"
# `client` is the transport-agnostic client protocol (docs/tools.md); the
# in-process servers above bring the `server` half through their own dependency.
# `cli` adds the `tools!` macro's clap derive and the stdio serve loop, which is
# what lets `efference control <tool>` and `efference mcp` be one definition
# (docs/operating.md).
mcplease = { version = "0.5.0", features = [
  "client",
  "cli",
], default-features = false }
# `efference mcp` drives mcplease's stdio transport over tokio's stdio.
async-compat = "0.2"
# JSON Schema derive for the control tools' arguments — what an MCP client reads
# out of `tools/list` — for the config files' published schemas (assets/schemas),
# and, under `cfg(test)` only, for the control channel's types: a test writes the
# schema the web client's TypeScript is generated from. Same major as mcplease's
# own, so there is one schemars. `indexmap2` for `[context]`, an `IndexMap`.
schemars = { version = "1.2.3", features = ["indexmap2"] }
anyhow = "1"
# Lightweight logging facade + env-driven backend. The daemon emits request sizes,
# triage fallbacks, capped tool results, and full API error bodies; control verbosity
# with RUST_LOG (e.g. `RUST_LOG=efference=debug efference serve`).
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.54.1", features = [
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "io-std",
  "io-util",
  "fs",
  "net",
] }
libc = "0.2.191"
clap = { version = "4", features = ["derive", "env"] }
# Core trillium types (Conn/Handler/Method) for the control-channel HTTP server.
trillium = "1.4.1"
# Already in-tree under trillium; direct only to name the inner conn type the TCP
# gate reads `authority()` from — h2's `:authority` is not consulted by
# `trillium::Conn::host()` (docs/web-bind.md).
trillium-http = "1.8"
trillium-client = { version = "0.9.20", features = ["sse"] }
trillium-client-retry = "0.1"
trillium-rustls = "0.11.3"
# 0.6.4 adds `UnixClientConfig` — the client-side Unix-socket connector the
# control-channel client (src/clients/client.rs) dials the daemon through (DESIGN §10).
trillium-tokio = "0.6.4"
# StreamExt for consuming the SSE EventStream; already in-tree via trillium.
futures-lite = "2.6.1"
trillium-router = "0.5.3"
# Already in-tree under trillium-tokio; a direct dependency only to *name* the
# `ServerHandle` the TCP bind's spawn returns (docs/web-bind.md).
trillium-server-common = "0.7"
# HTTP/3 for the TLS bind (docs/web-bind.md): a QUIC listener on the same port,
# auto-paired with the TLS listener and advertised via alt-svc.
trillium-quinn = "0.1.7"
# HEAD requests: rewritten to GET going in, body stripped (content-length kept)
# coming out — the router itself has no HEAD story.
trillium-head = "0.3"
# Validators on every successful GET: an `etag` from the body, `if-none-match` answered
# with a 304. What the single-entry reads use instead of `immutable` (docs/control-api.md).
trillium-caching-headers = "0.4.3"
trillium-sse = "0.4.0"
# The MCP mount's status streams (docs/operating.md): one loopback WebSocket per agent,
# each frame a status, for a client that turns frames into notifications.
trillium-websockets = "0.9.3"
# The web client (docs/web-client.md): builds `web/` at compile time and embeds
# the dist assets in the binary; the `dev-proxy` feature below proxies to a
# spawned Vite dev server instead (HMR). Build mode needs pnpm on PATH.
trillium-frontend = "0.4.3"

# TUI (DESIGN §10 — the interactive client). Vendored-and-adapted from ferritin's
# interactive renderer into src/clients/tui/: a ratatui document renderer with syntect
# theming, markdown parsing, a custom scrollbar, line wrapping, and collapsible
# nodes. crossterm/crossbeam drive the dedicated UI thread; the SSE event tail is
# bridged in from tokio (src/main.rs).
ratatui = "0.30"
crossterm = "0.29"
crossbeam-channel = "0.5"
pulldown-cmark = "0.13"
percent-encoding = "2.3"
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "html",
  "plist-load",
  "yaml-load",
  "dump-load",
  "dump-create",
  "regex-onig",
] }
# Used by the vendored render_context (getters/builders) and its theme error type.
fieldwork = "0.5.5"
thiserror = "2"
unicode-width = "0.2.3"
unicode-segmentation = "1.13"
# System clipboard for the interactive TUI. The adapter in `src/clients/tui/clipboard.rs`
# keeps OS access and its in-process fallback outside the deterministic composer.
# `image-data` is on because a pasted screenshot is an attachment (docs/inbox.md):
# the clipboard's raw RGBA is re-encoded as a PNG into the store. It costs the
# image/tiff/zune-jpeg stack, most of which `image` (below) already pulls in.
arboard = { version = "3.7.0", default-features = false, features = [
  "image-data",
] }
# Bash parsing for the `[commands]` fast path (docs/permissions.md). brush-parser is the
# parser of the actively-maintained brush shell, so it tracks bash syntax and keeps
# receiving updates — the reason it replaced a pinned-old yash-syntax (whose later
# versions pull in the whole yash runtime). We parse, bash executes.
brush-parser = "0.4.0"
# Config (docs/permissions.md): the file is TOML, decoded via `toml_edit`'s
# serde layer and edited in place via its format-preserving `DocumentMut` — the same crate both
# reads the config and writes the harness's auto-persisted edits back, comments intact. A parse
# error carries a source span; its `Display` renders the offending line (the load-time diagnostic
# that stands in for KDL's miette report).
toml_edit = { version = "0.25.17", features = ["serde"] }
# Order-preserving map. `[context]` entries render as preamble sections in the operator's
# document order (backlog/preamble-context.md), so they can't ride the sorted BTreeMap the
# policy tables use. Already compiled in-tree via toml_edit; this just promotes it to direct.
indexmap = { version = "2", features = ["serde"] }
notify-debouncer-full = "0.7"
# The discovery ignore set (docs/web-bind.md): `/files` listings, the recursive
# listing behind the finder, and directory-scope change streams all hide what
# git hides. Already compiled in-tree; this promotes it to direct.
ignore = "0.4"
# OAuth for connected HTTP providers (docs/mcp-auth.md). `FollowRedirects` is a
# client handler: OAuth discovery chases `Location` across origins, and it drops
# `Authorization`/`Cookie` on a cross-origin hop, which is exactly the leak the
# spec's threat model is about. trillium-client does not follow redirects itself.
trillium-redirect = { version = "0.3.0", features = ["client"] }
# PKCE (RFC 7636 S256): a CSPRNG verifier, its SHA-256 digest, base64url-nopad
# for both. efference is a *public* OAuth client — a shipped binary can hold no
# secret — so PKCE is what stands between an intercepted authorization code and
# a token, and these three are load-bearing rather than incidental.
base64 = "0.23.1"
sha2 = "0.11.1"
rand = "0.10.3"
# Root-derived credentials for the TCP bind (docs/web-bind.md): HKDF with per-purpose
# context strings turns the one injected root into the key device tokens are tagged
# under — same root in, same secrets out, nothing secret on disk. data-encoding
# spells a device's id in the hex the table, the routes, and the command line share.
hkdf = "0.13"
hmac = "0.13"
data-encoding = "2"
# Opens the operator's browser for the MCP authorization step (docs/mcp-auth.md).
# Only reached from `efference serve` with a tty; a headless boot prints the URL
# instead, since there is no browser to hand a redirect back to.
webbrowser = "1.2.5"
jiter = { version = "0.18.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
# Terminal image rendering for the TUI (docs/tui.md): protocol detection
# (kitty/iTerm2), the font-size-in-pixels query, per-protocol encoding, and the
# cell-skip that keeps ratatui from overwriting a drawn image. Default features
# off: they re-enable all of `image`'s decoders (the slim set above is the
# decode surface) and add a pkg-config dependency on libchafa.
ratatui-image = { version = "11", default-features = false, features = [
  "crossterm",
] }
# Web push (docs/web-push.md). Both halves of the protocol are P-256: `ecdh` is
# RFC 8291 payload encryption (the sender's ephemeral key against the
# subscription's), `ecdsa` is the RFC 8292 VAPID token. The 0.14/0.11 line is the
# RustCrypto generation the in-tree hkdf 0.13 / hmac 0.13 / sha2 0.11 belong to,
# so there is one digest stack rather than two.
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.11"
# Explicit model picks, remembered per project (docs/transport.md): one row per
# session creation, read back as the model default and the recent menu. Bundled
# build, so no system sqlite is needed; concurrent readers/writers are why this
# is a real store rather than one more machine-written text file.
rusqlite = { version = "0.41.0", features = ["bundled"] }

# The secret store (docs/secrets.md): one get/set/delete over the user's OS
# credential store. `keyring-core` is the store-agnostic entry API; the platform
# stores are linked directly rather than through the `keyring` umbrella, per that
# crate's own guidance for applications that choose their store.
keyring-core = "1"
trillium-logger = "0.5.5"
# The update check (docs/update-check.md): `minisign-verify` checks the release
# signature over `latest.json` and its trusted comment, with no dependencies of its
# own; `semver` orders the release against this build. semver is already in-tree.
minisign-verify = "0.3"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The login keychain, used in-process only when the binary is identity-signed;
# an ad-hoc build shells out to `security` instead (docs/secrets.md).
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# `SecCode::for_self` answers "is this binary identity-signed" at startup.
security-framework = "3.7"
# The pasteboard's change count and type list — whether the clipboard holds an image,
# learned without reading it (docs/tui.md). Already in the tree through arboard.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPasteboard",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSEnumerator",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over zbus; the runtime feature matches the daemon's tokio.
zbus-secret-service-keyring-store = { version = "1", features = [
  "rt-tokio-crypto-rust",
] }

[features]
default = ["dev"]
# The `efference dev <verb>` group: the instruments for developing efference
# itself (docs/operating.md). In `default` because a gated feature nobody builds
# rots; a release build passes `--no-default-features`.
dev = []
# Serve the web client from a spawned Vite dev server (with HMR) instead of the
# compile-time embed: `cargo run --features dev-proxy -- serve --bind …`.
dev-proxy = ["trillium-frontend/dev-proxy"]

[dev-dependencies]
# The output-text tests match repository-relative paths (`docs/…`) in help and tool
# schemas.
regex = "1.13"

# Paused time (`start_paused`) for the escalation timer's tests: a two-minute
# delay is advanced, not slept.
tokio = { version = "1.54.1", features = ["test-util"] }

# Scratch directories for the tests that need a real filesystem: a name that cannot repeat
# and a directory removed when its guard drops (`crate::platform::testing::temp_dir`).
tempfile = "3"

# Snapshot the TUI as plain-text character grids (DESIGN: "playwright for TUIs").
# File snapshots land in src/clients/tui/snapshots/*.snap — committed, diffable, and
# readable without running anything. `cargo insta review` / `accept` to update.
insta = "1.49.0"

# Drive the control router over an in-memory virtual transport: `connector()` builds
# a client-side Connector from a handler, which `Client::with_connector` accepts. No
# socket is bound, so the daemon tests neither collide on a fixed path nor hit
# Darwin's 104-byte `SUN_LEN` limit on the harness's long per-session $TMPDIR.
# The `tokio` feature runs test handlers on the same runtime the daemon uses
# (`trillium-tokio`); without it the harness approximates a runtime by spawning
# threads, and any handler touching tokio primitives (`tokio::time::timeout` in
# the settle wait) panics off-runtime.
trillium-testing = { version = "0.10.2", features = ["tokio"] }
# The status stream tests' WebSocket client (docs/operating.md): the mount only serves
# one, so the client half is a test-only feature.
trillium-client = { version = "0.9.20", features = ["sse", "websockets"] }

[build-dependencies]
# The theme set is baked at build time from assets/themes/*/*.tmTheme into OUT_DIR
# (see build.rs, vendored from ferritin). The .tmTheme files come from the git
# submodules under assets/themes/ — a fresh clone needs
# `git submodule update --init --recursive` or the build falls back to an empty set.
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "plist-load",
  "dump-load",
  "dump-create",
  "regex-onig",
] }

# Beyond rustc's and clippy's defaults. The bar is zero warnings, so a lint is enabled in the change that clears it.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

# Doc comments link to private items on purpose: efference publishes no rustdoc, and the
# docs are read with `--document-private-items`, which is the only way these links resolve.
[lints.rustdoc]
private_intra_doc_links = "allow"

# Considered and not adopted: must_use_candidate, missing_errors_doc, missing_panics_doc and
# missing_docs, library-API lints that push toward doc comments restating docs/ (efference
# publishes no library API; process/comments.md); doc_markdown; wildcard_imports, nearly all
# the tests' `use super::*`; the cast_* family; multiple_crate_versions;
# missing_debug_implementations.
[lints.clippy]
dbg_macro = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
struct_excessive_bools = "warn"
too_many_lines = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"

# The profile dist builds release artifacts with (process/releasing.md).
[profile.dist]
inherits = "release"
lto = "thin"
