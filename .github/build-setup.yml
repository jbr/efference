# Steps dist's release.yml runs before each build (github-build-setup in
# dist-workspace.toml). The web client is compiled into the binary, and its
# build runs pnpm.
- name: Install pnpm
  uses: pnpm/action-setup@v6
  with:
    package_json_file: web/package.json
- name: Install Node
  uses: actions/setup-node@v7
  with:
    node-version: lts/*
    cache: pnpm
    cache-dependency-path: web/pnpm-lock.yaml
# dist reads CODESIGN_OPTIONS but its workflow does not pass it through. The
# notary service rejects a binary signed without the hardened runtime.
- name: Sign with the hardened runtime
  if: runner.os == 'macOS'
  run: echo "CODESIGN_OPTIONS=runtime" >> "$GITHUB_ENV"
