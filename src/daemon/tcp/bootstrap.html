<!doctype html>
<!-- The bootstrap page (docs/web-bind.md): the anonymous shell served at GET /.
     Reads #token= from the fragment (never sent to the server or its logs), trades it
     at POST /auth/session for the session cookie, scrubs the URL; a bare visit gets
     the six-digit field. Replaced wholesale by the web client when that ships. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>efference</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
  input { font: inherit; width: 8ch; letter-spacing: 0.3ch; }
  button { font: inherit; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>efference</h1>
<p id="status">checking session…</p>
<form id="code-form" hidden>
  <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
         autocomplete="one-time-code" placeholder="123456" autofocus>
  <button>authenticate</button>
</form>
<pre id="state" hidden></pre>
<script>
"use strict";
const el = (id) => document.getElementById(id);

async function currentState() {
  const r = await fetch("/v1/state", { headers: { accept: "application/json" } });
  return r.ok ? r.json() : null;
}

function submitCode(code) {
  return fetch("/auth/session", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ code }),
  });
}

(async () => {
  const token = new URLSearchParams(location.hash.slice(1)).get("token");
  if (token) history.replaceState(null, "", location.pathname);
  let state = await currentState();
  if (!state && token && (await submitCode(token)).ok) state = await currentState();
  if (state) {
    el("status").textContent = "authenticated";
    el("state").hidden = false;
    el("state").textContent = JSON.stringify(state, null, 2);
    return;
  }
  el("status").textContent = "enter the current code (efference open, or an enrolled authenticator)";
  el("code-form").hidden = false;
  el("code-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const r = await submitCode(el("code").value);
    if (r.ok) { location.reload(); return; }
    const body = await r.json().catch(() => ({}));
    el("status").textContent = body.message || `authentication failed (${r.status})`;
  });
})();
</script>
</body>
</html>
